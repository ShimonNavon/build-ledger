server {
    listen 100.66.219.81:443 ssl;
    server_name builds.navonsimon.com;
    ssl_certificate /etc/letsencrypt/live/builds.navonsimon.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/builds.navonsimon.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    allow 100.64.0.0/10;
    deny all;
    location / {
        proxy_pass http://100.126.164.46:30096;
        proxy_set_header X-Ledger-Gateway "__GATEWAY_TOKEN__";
        proxy_set_header Host builds.navonsimon.com;
        proxy_set_header X-Forwarded-Proto https;
    }
}

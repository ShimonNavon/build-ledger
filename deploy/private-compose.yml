# On ubuntu01, /home/simon/build-ledger-private. nginx.conf is rendered with
# the private gateway token; it must never be committed or printed.
services:
  gateway:
    image: nginx:1.27-alpine
    container_name: build-ledger-private
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./letsencrypt:/etc/letsencrypt:ro

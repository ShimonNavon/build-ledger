server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    # The CNI masks client addresses; authenticate the private gateway instead.
    location = /healthz { allow all; access_log off; return 200 'ok'; }
    # Live machine temperatures, proxied from the thermal-monitor Service. The
    # resolver is used instead of a startup lookup so a missing Service can
    # never stop nginx from starting.
    location = /api/fleet {
        if ($http_x_ledger_gateway != "__GATEWAY_TOKEN__") { return 403; }
        resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;
        set $thermal thermal-monitor.thermal-monitor.svc.cluster.local;
        proxy_pass http://$thermal/api/temps;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $thermal;
        proxy_connect_timeout 3s;
        proxy_read_timeout 8s;
        add_header Cache-Control "no-store" always;
    }
    location / { if ($http_x_ledger_gateway != "__GATEWAY_TOKEN__") { return 403; } try_files $uri $uri/ =404; }
}

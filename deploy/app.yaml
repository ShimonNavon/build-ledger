apiVersion: v1
kind: Namespace
metadata: {name: build-ledger}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: build-ledger}
spec:
  replicas: 1
  selector: {matchLabels: {app: build-ledger}}
  template:
    metadata: {labels: {app: build-ledger}}
    spec:
      nodeSelector: {kubernetes.io/hostname: ubuntu04}
      containers:
      - name: nginx
        image: nginx:1.27.5-alpine
        ports: [{containerPort: 80}]
        resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {cpu: 200m, memory: 64Mi}}
        readinessProbe: {httpGet: {path: /healthz, port: 80}}
        volumeMounts:
        - {name: site, mountPath: /usr/share/nginx/html}
        - {name: branches, mountPath: /usr/share/nginx/html/branches, readOnly: true}
        - {name: access, mountPath: /etc/nginx/conf.d, readOnly: true}
      volumes:
      - {name: site, configMap: {name: site}}
      - {name: branches, configMap: {name: branches}}
      - {name: access, secret: {secretName: access}}
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: build-ledger}
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector: {app: build-ledger}
  ports: [{port: 80, targetPort: 80, nodePort: 30096}]
